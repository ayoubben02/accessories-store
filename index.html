<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ElectroSpace – Accessoires téléphone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--surface:#F4F5F7;--ink:#0B0D12;--muted:#5C6370;--line:#E1E4EA;--blue:#1E5BFF;--on-blue:#fff;--cartbg:#fff;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B0D12;--surface:#14171F;--ink:#F2F4F8;--muted:#9AA1B0;--line:#262B36;--blue:#3D6DFF;--cartbg:#14171F;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B0D12;--surface:#14171F;--ink:#F2F4F8;--muted:#9AA1B0;--line:#262B36;--blue:#3D6DFF;--cartbg:#14171F;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.55 Archivo,system-ui,sans-serif}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#0B0D12;z-index:30}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:#0B0D12;color:#fff}
header .wrap{display:flex;align-items:center;gap:8px;height:60px}
.logo{text-decoration:none;font-weight:800;font-size:23px;letter-spacing:-.03em;margin-right:auto;color:#fff}
.logo span{color:#4F86FF}
.ib{background:transparent;border:1px solid #2A2F3B;color:#fff;height:38px;padding:0 12px;border-radius:4px;cursor:pointer;font-weight:600}
.ib b{display:inline-block;min-width:20px;margin-left:6px;padding:0 5px;border-radius:10px;background:#4F86FF;color:#fff;font-size:13px;line-height:20px;text-align:center}
.strip{background:var(--blue);color:#fff;text-align:center;font-size:14px;font-weight:600;padding:7px 12px}
a{color:inherit}.crumb a{color:var(--muted)}
.ph{margin:14px 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;padding-bottom:56px}
.card{border:1px solid var(--line);text-decoration:none;display:block}
.card:hover{border-color:var(--ink)}
.card img{width:100%;aspect-ratio:1/1;object-fit:contain;background:#fff;display:block}
.cb{padding:12px 14px 16px;display:grid;gap:2px}
.cb h3{font-size:18px;font-weight:800;letter-spacing:-.01em;margin:0}
.crumb{font-size:14px;color:var(--muted);padding:18px 0 0}
.pdp{display:grid;grid-template-columns:1.05fr 1fr;gap:40px;padding:16px 0 40px;align-items:start}
.main{width:100%;aspect-ratio:1/1;object-fit:contain;background:#fff;border:1px solid var(--line);display:block}
.thumbs{display:flex;gap:8px;margin-top:8px}
.tb{width:68px;height:68px;padding:0;border:1px solid var(--line);background:#fff;cursor:pointer;opacity:.6}
.tb[aria-pressed="true"]{border:2px solid var(--blue);opacity:1}
.tb img,.th img{width:100%;height:100%;object-fit:cover;display:block;background:#fff}
.ref{font:500 13px "IBM Plex Mono",monospace;color:var(--muted);letter-spacing:.04em}
h1{font-size:clamp(28px,4.2vw,40px);line-height:1.08;letter-spacing:-.025em;font-weight:800;margin:6px 0 14px}
.price{font-size:34px;font-weight:800;letter-spacing:-.02em;margin:0 0 14px}
.lead{margin:0 0 14px;color:var(--muted)}
ul.ok{list-style:none;padding:0;margin:0 0 22px}
ul.ok li{padding:7px 0 7px 26px;border-top:1px solid var(--line);position:relative}
ul.ok li:last-child{border-bottom:1px solid var(--line)}
ul.ok li::before{content:"✓";position:absolute;left:2px;color:var(--blue);font-weight:800}
.buy{display:flex;gap:10px;flex-wrap:wrap}
.step{display:inline-flex;border:1px solid var(--line)}
.step button{width:42px;background:transparent;border:0;font-size:20px;cursor:pointer}
.step span{width:38px;display:grid;place-items:center;font-weight:600}
.btn{background:var(--blue);color:var(--on-blue);border:0;border-radius:4px;padding:12px 22px;font-weight:800;cursor:pointer}
.btn:hover{filter:brightness(1.1)}
.btn.line{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.btn.full{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.buy .btn{flex:1;min-width:150px}
section.info{padding:8px 0 48px}
h2{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0 0 14px}
table{width:100%;border-collapse:collapse;max-width:640px}
th,td{text-align:left;padding:10px 0;border-top:1px solid var(--line);vertical-align:top}
th{width:38%;font-weight:600;color:var(--muted)}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:36px}
.how b{font:500 13px "IBM Plex Mono",monospace;color:var(--blue)}
.how p{margin:4px 0 0}
footer{background:var(--surface);padding:24px 0;color:var(--muted);font-size:14px}
.bar{display:none}
.scrim{position:fixed;inset:0;background:rgba(5,7,12,.6);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--cartbg);z-index:41;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.on{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}
.dh h2{margin:0}
.items{flex:1;overflow:auto;padding:4px 20px}
.item{display:grid;grid-template-columns:60px 1fr auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.th{width:60px;height:60px;border:1px solid var(--line)}
.item .step{margin-top:6px;transform:scale(.85);transform-origin:left}
.df{padding:16px 20px;border-top:1px solid var(--line);display:grid;gap:10px}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:19px}
.empty{color:var(--muted);padding:24px 0}
dialog{border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:24px;width:min(440px,calc(100% - 32px));border-radius:6px}
dialog::backdrop{background:rgba(5,7,12,.65)}
dialog h2{margin-bottom:14px}
label{display:grid;gap:4px;margin-bottom:12px;font-weight:600}
label input{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px 12px;font-weight:400}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
@media (max-width:760px){
 .pdp{grid-template-columns:1fr;gap:20px}.how{grid-template-columns:1fr;gap:14px}
 body.pd{padding-bottom:72px}
 body.pd .bar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));align-items:center;justify-content:space-between;gap:12px}
 .bar b{font-size:20px;font-weight:800}.bar .btn{flex:1;max-width:220px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap">
  <a class="logo" href="#">Electro<span>Space</span></a>
  <button class="ib" id="theme" aria-label="Changer le thème clair ou sombre">🌙</button>
  <button class="ib" id="openCart">Panier<b id="count">0</b></button>
</div></header>
<div class="strip">Commandez en 1 minute, confirmation sur WhatsApp</div>

<main class="wrap" id="app"></main>
<footer><div class="wrap">© ElectroSpace. Les commandes se font par WhatsApp.</div></footer>

<div class="bar"><b id="barPrice"></b><button class="btn" id="buy2">Commander</button></div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-label="Panier">
  <div class="dh"><h2>Votre panier</h2><button class="btn line" id="closeCart">Fermer</button></div>
  <div class="items" id="items"></div>
  <div class="df"><div class="tot"><span>Total</span><span id="sub"></span></div><button class="btn full" id="checkout">Commande</button></div>
</aside>

<dialog id="dlg">
  <form id="form" method="dialog" novalidate>
    <h2>Vos informations</h2>
    <label>Nom complet<input name="name" required autocomplete="name"></label>
    <label>Téléphone<input name="phone" type="tel" required autocomplete="tel"></label>
    <label>Ville et adresse<input name="addr" required autocomplete="street-address"></label>
    <p id="err" style="color:#D93025;margin:0 0 8px" role="alert"></p>
    <div class="actions"><button type="button" class="btn line" id="cancel">Retour</button><button class="btn" type="submit">Envoyer sur WhatsApp</button></div>
  </form>
  <div id="done" hidden><h2>Presque terminé</h2><p>WhatsApp s’ouvre avec votre commande. Appuyez sur envoyer pour la confirmer.</p>
    <div class="actions"><button class="btn" id="ok">Fermer</button></div></div>
</dialog>

const P=[
 {id:1,slug:'t289',ref:'T-289',n:'Écouteurs T-289 Extra Bass',cat:'Écouteurs',price:59,imgs:T289,
  lead:'Écouteurs intra-auriculaires stéréo avec micro intégré et basses renforcées.',
  f:['Prise jack 3,5 mm','Micro avec bouton pour répondre et raccrocher','Son stéréo Hi-Fi, Extra Bass','Câble tressé, finition noire'],
  specs:[['Modèle','T-289'],['Connecteur','Jack 3,5 mm'],['Micro','Intégré, bouton réponse / fin d’appel'],['Câble','Tressé'],['Compatibilité','Téléphones, ordinateurs et consoles avec prise jack 3,5 mm'],['Couleur','Noir']]},
 {id:2,slug:'nia-q1',ref:'NIA Q1',n:'Casque Bluetooth NIA Q1',cat:'Casques',price:199,imgs:NIA,
  lead:'Un bon son et une superbe basse à petit prix : casque sans fil avec microphone, radio FM et lecteur Micro SD.',
  f:['4 en 1 : Bluetooth, lecteur Micro SD/TF, radio FM et câble jack 3,5 mm','Microphone intégré pour les appels mains libres','Lit les fichiers MP3 de la carte Micro SD/TF (carte non incluse)','Boutons de contrôle sur le casque (lecture, stop…) ou via Bluetooth','Pliable, batterie grande capacité'],
  specs:[['Modèle','NIA Q1'],['Connexion','Bluetooth ou câble jack 3,5 mm (câble non inclus)'],['Lecteur','Carte Micro SD/TF (non incluse), fichiers MP3'],['Radio','FM'],['Micro','Intégré, appels mains libres'],['Format','Pliable'],['Couleur','Noir']]}
];
const money=n=>n.toLocaleString('fr-FR')+' MAD';
const $=s=>document.querySelector(s);
let cart={},qty=1,cur=null;
try{cart=JSON.parse(localStorage.getItem('es-cart')||'{}')||{}}catch(e){}
Object.keys(cart).forEach(id=>{if(!P.some(p=>p.id==id))delete cart[id]});
const save=()=>{try{localStorage.setItem('es-cart',JSON.stringify(cart))}catch(e){}};

/* pages */
const HOW='<div class="how"><div><b>01</b><p>Choisissez la quantité et appuyez sur Commander.</p></div><div><b>02</b><p>Indiquez votre nom, votre téléphone et votre adresse.</p></div><div><b>03</b><p>WhatsApp s’ouvre avec votre commande. Envoyez-la, nous vous répondons.</p></div></div>';
function home(){
  cur=null;
  $('#app').innerHTML=`<div class="crumb">Accueil</div><h1 class="ph">Nos produits</h1><div class="grid">${P.map(p=>`<a class="card" href="#${p.slug}"><img src="${p.imgs[0]}" alt="${p.n}"><div class="cb"><span class="ref">${p.cat.toUpperCase()}</span><h3>${p.n}</h3><b>${money(p.price)}</b></div></a>`).join('')}</div>`;
}
function detail(p){
  cur=p;qty=1;
  $('#barPrice').textContent=money(p.price);
  $('#app').innerHTML=`<div class="crumb"><a href="#">Accueil</a> / ${p.cat} / ${p.ref}</div><div class="pdp"><div><img class="main" id="main" src="${p.imgs[0]}" alt="${p.n}"><div class="thumbs">${p.imgs.map((s,i)=>`<button class="tb" data-i="${i}" aria-label="Photo ${i+1}" aria-pressed="${i===0}"><img src="${s}" alt=""></button>`).join('')}</div></div><div><div class="ref">RÉF. ${p.ref}</div><h1>${p.n}</h1><p class="price">${money(p.price)}</p><p class="lead">${p.lead}</p><ul class="ok">${p.f.map(x=>`<li>${x}</li>`).join('')}</ul><div class="buy"><div class="step" aria-label="Quantité"><button id="minus" aria-label="Moins">−</button><span id="q">1</span><button id="plus" aria-label="Plus">+</button></div><button class="btn" id="buy">Commander</button><button class="btn line" id="add">Ajouter au panier</button></div></div></div><section class="info"><h2>Caractéristiques</h2><table>${p.specs.map(r=>`<tr><th>${r[0]}</th><td>${r[1]}</td></tr>`).join('')}</table>${HOW}</section>`;
}
function route(){
  const p=P.find(x=>x.slug===location.hash.slice(1));
  p?detail(p):home();
  document.body.classList.toggle('pd',!!p);
  document.title=(p?p.n+' – ':'')+'ElectroSpace';
  window.scrollTo(0,0);
}
const addQty=()=>{cart[cur.id]=(cart[cur.id]||0)+qty;save();renderCart()};
$('#app').onclick=e=>{
  const t=e.target.closest('.tb');
  if(t){$('#main').src=cur.imgs[+t.dataset.i];document.querySelectorAll('.tb').forEach(x=>x.setAttribute('aria-pressed',x===t));return}
  const id=e.target.closest('button')?.id;if(!id)return;
  if(id==='minus'){qty=Math.max(1,qty-1);$('#q').textContent=qty}
  else if(id==='plus'){qty=Math.min(20,qty+1);$('#q').textContent=qty}
  else if(id==='add'){addQty();openCart()}
  else if(id==='buy'){addQty();openForm()}
};
$('#buy2').onclick=()=>{if(cur){addQty();openForm()}};
addEventListener('hashchange',route);

/* panier */
const total=()=>Object.entries(cart).reduce((s,[id,q])=>s+P.find(p=>p.id==id).price*q,0);
function renderCart(){
  const ids=Object.keys(cart).filter(id=>cart[id]>0);
  $('#count').textContent=ids.reduce((s,id)=>s+cart[id],0);
  $('#items').innerHTML=ids.length?ids.map(id=>{const p=P.find(x=>x.id==id);
    return `<div class="item"><div class="th"><img src="${p.imgs[0]}" alt=""></div><div><b>${p.n}</b><div class="step"><button data-d="-1" data-id="${id}" aria-label="Moins">−</button><span>${cart[id]}</span><button data-d="1" data-id="${id}" aria-label="Plus">+</button></div></div><b>${money(p.price*cart[id])}</b></div>`}).join('')
    :'<p class="empty">Votre panier est vide.</p>';
  $('#sub').textContent=money(total());$('#checkout').disabled=!total();
}
$('#items').onclick=e=>{const b=e.target.closest('[data-d]');if(!b)return;
  const id=b.dataset.id;cart[id]=(cart[id]||0)+Number(b.dataset.d);if(cart[id]<=0)delete cart[id];save();renderCart()};
const drawer=$('#drawer'),scrim=$('#scrim'),dlg=$('#dlg'),form=$('#form');
function openCart(){drawer.classList.add('on');scrim.classList.add('on');drawer.setAttribute('aria-hidden','false');$('#closeCart').focus()}
function closeCart(){drawer.classList.remove('on');scrim.classList.remove('on');drawer.setAttribute('aria-hidden','true')}
$('#openCart').onclick=openCart;$('#closeCart').onclick=closeCart;scrim.onclick=closeCart;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!dlg.open)closeCart()});

/* commande WhatsApp */
function openForm(){form.hidden=false;$('#done').hidden=true;$('#err').textContent='';dlg.showModal()}
$('#checkout').onclick=openForm;
$('#cancel').onclick=()=>dlg.close();
$('#ok').onclick=()=>{dlg.close();closeCart()};
form.onsubmit=e=>{e.preventDefault();
  const f=new FormData(form),v=k=>String(f.get(k)).trim();
  if(!v('name')||!v('phone')||!v('addr')){$('#err').textContent='Indiquez votre nom, votre téléphone et votre adresse.';return}
  const lines=Object.keys(cart).filter(id=>cart[id]>0).map(id=>{const p=P.find(x=>x.id==id);return `• ${p.n} × ${cart[id]} = ${money(p.price*cart[id])}`});
  const msg=`Nouvelle commande\n\n${lines.join('\n')}\n\nTotal: ${money(total())}\n\nNom: ${v('name')}\nTéléphone: ${v('phone')}\nAdresse: ${v('addr')}`;
  const a=document.createElement('a');a.href=`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;a.target='_blank';a.rel='noopener';
  document.body.appendChild(a);a.click();a.remove();
  cart={};save();renderCart();form.reset();form.hidden=true;$('#done').hidden=false};

/* thème */
const root=document.documentElement;
function setTheme(t,persist){root.setAttribute('data-theme',t);$('#theme').textContent=t==='dark'?'☀️':'🌙';if(persist){try{localStorage.setItem('es-theme',t)}catch(e){}}}
let st=null;try{st=localStorage.getItem('es-theme')}catch(e){}
setTheme(st||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'),false);
$('#theme').onclick=()=>setTheme(root.getAttribute('data-theme')==='dark'?'light':'dark',true);
renderCart();route();
</script>
</body>
</html>
